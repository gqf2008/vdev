[workspace]
# vdev-app-win 独立 workspace：Windows 专用 GUI（Slint），不影响 macOS 主仓库。
resolver = "2"
members = ["."]

[package]
name = "vdev-app-win"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Windows 版 vdev 虚拟摄像头 GUI（Slint + slint-pixel，复用 vdev-app 像素风）"

[[bin]]
name = "vdev-app-win"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.17"
slint-pixel = { git = "https://github.com/gqf2008/slint-pixel" }

[dependencies]
slint = { version = "1.17", features = ["unstable-winit-030"] }
slint-pixel = { git = "https://github.com/gqf2008/slint-pixel" }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 音频增强面板（图示 EQ + 响度归一化 + 前瞻真峰值限幅）直接驱动 vdev-dsp；
# vdev-dsp 零第三方依赖，且自身是主仓 workspace 成员（此处只取算法、不改其源码）。
vdev-dsp = { path = "../vdev-dsp" }

# Windows 专用依赖按 cfg(windows) 门控：bin（main.rs）在 Windows 上链接它；
# 门控后 macOS 宿主只需构建无 Windows 依赖的 lib 目标（src/lib.rs 纯逻辑），
# `cargo test --lib` 才能真正跑通（bin 本就只能在 Windows 侧构建）。
[target.'cfg(windows)'.dependencies]
# 复用 Windows 虚拟摄像头的安全封装（注册/注销/推流/枚举）
vdev-camera-win = { path = "../vdev-camera-win" }
