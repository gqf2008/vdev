[package]
name = "driver-ipc"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[dependencies]
log = "0.4.22"
serde = { version = "1.0.215", features = ["derive"] }
thiserror = "2.0.3"
serde_json = "1.0.133"
tokio = { version = "1.42.0", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "net",
    "macros",
] }
tokio-stream = { version = "0.1.17", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.42.0", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "net",
    "macros",
    "io-util",
] }
