[package]
name = "vdev-display-driver"
version = "0.4.0"
edition = "2021"

[lints]
workspace = true

[lib]
name = "vdev_display"
crate-type = ["cdylib"]

[dependencies]
thiserror = "2.0.3"
anyhow = "1.0.93"
wdf-umdf-sys = { path = "../wdf-umdf-sys" }
wdf-umdf = { path = "../wdf-umdf" }
log = "0.4.22"
bytemuck = { version = "1.19.0", features = ["derive"] }
serde_json = "1.0.133"
driver-ipc = { path = "../driver-ipc" }
driver-logger = { path = "../driver-logger" }
tokio = { version = "1.42.0", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "io-util",
    "sync",
] }

[dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Dxgi",
]

# minor(f)：winreg 0.52 在非 Windows 宿主直接 compile_error!（见其 src/lib.rs），
# 且只被 build.rs 的 Windows SDK 注册表探测使用 —— 移入 target 门控，
# 避免 macOS 宿主侧的构建在编译 build-dependencies 阶段即失败。
[target.'cfg(windows)'.build-dependencies]
winreg = "0.52.0"

[build-dependencies]
winres = "0.1.12"
vergen-gix = { version = "1.0.2", features = ["build"] }

[package.metadata.winres]
OriginalFilename = "vdev_display.dll"
ProductName = "vdev 虚拟显示器"
FileDescription = "vdev Indirect Display (IddCx UMDF) driver"



