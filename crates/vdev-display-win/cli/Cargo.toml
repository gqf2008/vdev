[package]
name = "vdev-display-win"
version = "0.1.0"
edition = "2021"
description = "vdev 虚拟显示器（IddCx UMDF）安装与控制器"

[[bin]]
name = "vdev-display-win"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.21", features = ["derive"] }
anyhow = "1.0.93"
driver-ipc = { path = "../driver-ipc" }
serde_json = "1.0.133"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.3"
widestring = "1.1.0"

[dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_UI_WindowsAndMessaging",
]

