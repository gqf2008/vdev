[package]
name = "vdev-display-win"
version = "0.1.0"
edition = "2021"
description = "vdev 虚拟显示器（IddCx UMDF）安装与控制器"

[[bin]]
name = "vdev-display-win"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.21", features = ["derive"] }
anyhow = "1.0.93"
driver-ipc = { path = "../driver-ipc" }
serde_json = "1.0.133"
serde = { version = "1.0", features = ["derive"] }

[dependencies.windows]
version = "0.58.0"
# 注意：Win32_System_Registry 必须保留——windows 0.58 的 SHELLEXECUTEINFOW /
# ShellExecuteExW（UAC 提权）整体挂在该 feature 下，尽管本 crate 不引用
# System::Registry 路径（已核对 windows-0.58.0 源码 cfg(feature) 门控）。
features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Registry",
]




