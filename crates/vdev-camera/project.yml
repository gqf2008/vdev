name: VDCamera
options:
  bundleIdPrefix: com.vdev
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    DEVELOPMENT_TEAM: XFXU84HVK3
    GENERATE_INFOPLIST_FILE: NO

targets:
  VDCameraExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: extension
        excludes:
          - "*.entitlements"
    settings:
      base:
        # 关键：.systemextension 文件名（去后缀）必须等于 bundle ID，否则 sysextd 报
        # OSSystemExtensionErrorDomain Code=4 "Extension not found in App bundle"
        PRODUCT_NAME: com.vdev.camera.host.extension
        PRODUCT_BUNDLE_IDENTIFIER: com.vdev.camera.host.extension
        INFOPLIST_FILE: extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: extension/VDCameraExtension.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: extension/RustBridge.h
        OTHER_LDFLAGS:
          - "$(SRCROOT)/../../target/release/libvdev_camera.a"

  vdev-camera:
    type: application
    platform: macOS
    sources:
      - path: host
        excludes:
          - "*.entitlements"
    dependencies:
      - target: VDCameraExtension
        embed: true
    settings:
      base:
        PRODUCT_NAME: VDCamera
        EXECUTABLE_NAME: vdev-camera
        PRODUCT_BUNDLE_IDENTIFIER: com.vdev.camera.host
        INFOPLIST_FILE: host/Info.plist
        CODE_SIGN_ENTITLEMENTS: host/vdev-camera.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  vdev-camera:
    build:
      targets:
        vdev-camera: all
    run:
      config: Release
