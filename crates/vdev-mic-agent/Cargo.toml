[package]
name = "vdev-mic-agent"
description = "AI microphone front-end: capture -> denoise -> inject into the vdev virtual microphone"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
