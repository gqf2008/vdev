[package]
name = "vdev-audio-win"
version = "0.1.0"
edition = "2024"
description = "vdev 虚拟声卡（PortCls 内核驱动）安装与控制器"

[[bin]]
name = "vdev-audio-win"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.93"
clap = { version = "4.5.21", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.3"
widestring = "1.1.0"

[dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Registry",
]
