name: release

# 发版：打 tag（v*）时构建 + 签名 + 装机包自检 + 打包 + 挂 GitHub Release。
# 也可手动 workflow_dispatch（出一份 prerelease，便于验证流水线本身）。
#
# 签名模式（同一套脚本，靠环境变量切换，见 scripts/sign-common.ps1）：
#   * 默认：CI 里现生成自签代码签名证书 → 签 .sys/.cat → 公钥导出成
#     `vdev-test-signing.cer` 打进每个包。**目标机需信任该证书并开测试签名**
#     （`bcdedit /set testsigning on`），与 README 的本机验收方式一致。
#   * 官方签名：仓库 secrets 提供 `VDEV_SIGN_PFX_BASE64` + `VDEV_SIGN_PFX_PASSWORD`
#     时改用该证书（EV/Trusted Signing 证书可走微软 attestation 提交流程；
#     提交流程本身需要 Partner Center 凭据，属后续接线点）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（留空则用 v0.0.0-dev.<run_number>）"
        required: false

permissions:
  contents: write

jobs:
  # ---------- 三个内核驱动：构建 → stage+sign → 自检 → 打包 ----------
  windows-drivers:
    name: 驱动 ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vdev-hid-win
            build-dir: crates/vdev-hid-win/kernel
            build: cargo build --release --target x86_64-pc-windows-msvc
            cache: crates/vdev-hid-win/kernel
            stage: crates/vdev-hid-win/scripts/stage-sign-hid.ps1
            dist: crates/vdev-hid-win/target/dist
            inf: vdev-hid.inf
            binary: vdev_hid.sys
            cat: vdev-hid.cat
            extra-dir: crates/vdev-hid-win
            extra: cargo build --release --target x86_64-pc-windows-msvc -p vdev-hid-win
            extra-file: crates/vdev-hid-win/target/x86_64-pc-windows-msvc/release/vdev-hid-win.exe
          - name: vdev-audio-win
            build-dir: crates/vdev-audio-win
            build: cargo build --release --features kernel -p vdev-audio-driver --target x86_64-pc-windows-msvc
            cache: crates/vdev-audio-win
            stage: crates/vdev-audio-win/scripts/stage-sign-audio.ps1
            dist: crates/vdev-audio-win/target/dist
            inf: vdev-audio.inf
            binary: vdev_audio.sys
            cat: vdev-audio.cat
            extra-dir: crates/vdev-audio-win
            extra: cargo build --release --target x86_64-pc-windows-msvc -p vdev-audio-win
            extra-file: crates/vdev-audio-win/target/x86_64-pc-windows-msvc/release/vdev-audio-win.exe
          - name: vdev-display-win
            build-dir: crates/vdev-display-win
            build: cargo build --release --target x86_64-pc-windows-msvc -p vdev-display-driver -p vdev-display-win
            cache: crates/vdev-display-win
            stage: crates/vdev-display-win/scripts/stage-sign.ps1
            dist: crates/vdev-display-win/target/dist
            inf: vdev-display.inf
            binary: vdev_display.dll
            cat: vdev-display.cat
            extra-dir: .
            extra: ""
            extra-file: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.cache }}
      - name: 安装 WDK + LLVM（bindgen 与 signtool/Inf2Cat）
        shell: pwsh
        run: |
          winget install --id Microsoft.WindowsWDK.10.0.26100 --exact --silent --accept-package-agreements --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::WDK winget 安装失败 (exit=$LASTEXITCODE)" }
          winget list --id LLVM.LLVM --exact > $null
          if ($LASTEXITCODE -ne 0) { winget install --id LLVM.LLVM --exact --silent --accept-package-agreements --accept-source-agreements }
          Add-Content $env:GITHUB_ENV "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin"
          exit 0
      - name: 准备签名证书
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.VDEV_SIGN_PFX_BASE64 }}
          PFX_PWD: ${{ secrets.VDEV_SIGN_PFX_PASSWORD }}
        run: |
          if ($env:PFX_B64) {
            $pfx = Join-Path $env:RUNNER_TEMP "vdev-sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
            Add-Content $env:GITHUB_ENV "VDEV_SIGN_PFX=$pfx"
            Add-Content $env:GITHUB_ENV "VDEV_SIGN_PFX_PASSWORD=$($env:PFX_PWD)"
            Add-Content $env:GITHUB_ENV "VDEV_SIGN_TRUST=1"
            Write-Host "签名模式：仓库 secrets 提供的 PFX"
          } else {
            $cert = New-SelfSignedCertificate -Type CodeSigningCert `
              -Subject "CN=vdev Virtual Display Driver" -FriendlyName "vdev-driver" `
              -CertStoreLocation Cert:\CurrentUser\My -KeyUsage DigitalSignature `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
            $alphabet = "abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789"
            $plain = -join (1..32 | ForEach-Object { $alphabet[(Get-Random -Maximum $alphabet.Length)] })
            $pfx = Join-Path $env:RUNNER_TEMP "vdev-selfsigned.pfx"
            Export-PfxCertificate -Cert $cert -FilePath $pfx `
              -Password (ConvertTo-SecureString -String $plain -AsPlainText -Force) | Out-Null
            Add-Content $env:GITHUB_ENV "VDEV_SIGN_PFX=$pfx"
            Add-Content $env:GITHUB_ENV "VDEV_SIGN_PFX_PASSWORD=$plain"
            Add-Content $env:GITHUB_ENV "VDEV_SIGN_TRUST=1"
            Write-Host "签名模式：CI 现生成自签证书（产物需目标机装 .cer 并开测试签名）"
          }
      - name: 构建驱动
        shell: pwsh
        working-directory: ${{ matrix.build-dir }}
        run: ${{ matrix.build }}
      - name: 构建附属 CLI
        if: ${{ matrix.extra != '' }}
        shell: pwsh
        working-directory: ${{ matrix.extra-dir }}
        run: ${{ matrix.extra }}
      - name: 打包 + 签名
        shell: pwsh
        run: pwsh -NoProfile -File ${{ matrix.stage }}
      - name: 装机包自检（文件 + signtool verify /pa）
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/verify-dist.ps1 `
            -Dist "${{ matrix.dist }}" -Inf "${{ matrix.inf }}" `
            -Binary "${{ matrix.binary }}" -Cat "${{ matrix.cat }}" -RequireCer
      - name: 组装 zip
        id: pack
        shell: pwsh
        run: |
          $dist = "${{ matrix.dist }}"
          if ("${{ matrix.extra-file }}" -ne "") { Copy-Item "${{ matrix.extra-file }}" $dist }
          $tag = if ("${{ github.event.inputs.tag }}") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          $zip = Join-Path $env:RUNNER_TEMP "${{ matrix.name }}-$tag.zip"
          Compress-Archive -Path (Join-Path $dist "*") -DestinationPath $zip -Force
          Get-ChildItem $dist | Select-Object Name, Length
          Add-Content $env:GITHUB_OUTPUT "zip=$zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error

  # ---------- 用户态工具（免签名）：摄像头 CLI + 宿主 GUI ----------
  windows-tools:
    name: 用户态工具
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/vdev-camera-win
            crates/vdev-app-win
      - name: 构建
        shell: pwsh
        run: |
          Push-Location crates/vdev-camera-win
          cargo build --release --target x86_64-pc-windows-msvc
          Pop-Location
          Push-Location crates/vdev-app-win
          cargo build --release --target x86_64-pc-windows-msvc
          Pop-Location
          # mic-agent 在根 workspace 里，Windows 上可直接构建（见 ci.yml 的 windows-user 矩阵）
          cargo build --release --target x86_64-pc-windows-msvc -p vdev-mic-agent
      - name: 取 RNNoise DLL（mic-agent 的降噪后端）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # 钉死 MSYS2 包与包内 DLL 两个哈希：包升级 → 这里立刻红，而不是静默换掉降噪后端
          $pkgUrl = "https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-rnnoise-0.2-2-any.pkg.tar.zst"
          $pkgSha = "6892ed69c436e9d5f006df8b3fcf7efb2f57d556338db545eb8e2d6e55a820cf"
          $dllSha = "860d319b2e45e68c66b0d3eed680dd8c7a0887d4e1854c734202a20083ee56b7"
          $work = Join-Path $env:RUNNER_TEMP "rnnoise"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $pkg = Join-Path $work "rnnoise.pkg.tar.zst"
          curl.exe -fsSL --retry 3 -o $pkg $pkgUrl
          $gotPkg = (Get-FileHash $pkg -Algorithm SHA256).Hash.ToLower()
          if ($gotPkg -ne $pkgSha) { throw "MSYS2 包哈希不匹配：期望 $pkgSha，实际 $gotPkg" }
          # 解包：MSYS2 把 bsdtar 拆成独立包（基础镜像不一定有），所以先试 bsdtar，
          # 再退到镜像里存在的 zstd + Windows 自带 tar.exe。两条都失败就报清楚是哪一步缺工具。
          $bsdtar = "C:\msys64\usr\bin\bsdtar.exe"
          $unpacked = $false
          if (Test-Path $bsdtar) {
            & $bsdtar -xf $pkg -C $work
            $unpacked = ($LASTEXITCODE -eq 0)
          }
          if (-not $unpacked) {
            $zstd = (Get-Command zstd.exe -ErrorAction SilentlyContinue).Source
            if (-not $zstd) { $zstd = "C:\ProgramData\chocolatey\bin\zstd.exe" }
            if (-not (Test-Path $zstd)) { throw "既没有 $bsdtar 也没有 zstd：无法解开 MSYS2 包" }
            $tarFile = Join-Path $work "rnnoise.pkg.tar"
            & $zstd -d -f -q -o $tarFile $pkg
            tar.exe -xf $tarFile -C $work
            if ($LASTEXITCODE -ne 0) { throw "tar.exe 解包失败" }
          }
          $dll = Join-Path $work "ucrt64/bin/librnnoise-0.dll"
          if (-not (Test-Path $dll)) { throw "包里没有 ucrt64/bin/librnnoise-0.dll" }
          $gotDll = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLower()
          if ($gotDll -ne $dllSha) { throw "librnnoise-0.dll 哈希不匹配：期望 $dllSha，实际 $gotDll" }
          # BSD-3-Clause：二进制再分发必须随附许可证原文
          $lic = Join-Path $work "ucrt64/share/licenses/rnnoise/LICENSE"
          if (-not (Test-Path $lic)) { throw "MSYS2 包里没有 share/licenses/rnnoise/LICENSE（许可证必须随包分发）" }
          $out = Join-Path $env:RUNNER_TEMP "vdev-tools-win"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $dll (Join-Path $out "librnnoise-0.dll")
          Copy-Item $lic (Join-Path $out "librnnoise-LICENSE.txt")
          Copy-Item crates/vdev-mic-agent/THIRD_PARTY.md $out
          Copy-Item target/x86_64-pc-windows-msvc/release/vdev-mic-agent.exe $out
          Write-Host "RNNoise 0.2-2 就绪：dll sha256=$gotDll（含 LICENSE）"
      - name: mic-agent 加载冒烟（真跑二进制，不是探针）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # 用真二进制 + 真 dylib/dll 跑一次降噪：mic-agent 运行时 dlopen "librnnoise-0.dll"，
          # 而它只在"可执行文件旁边"找——staging 目录就是最终 zip 的内容，所以这步过了，
          # "包里有 DLL 但用户跑不起来"这类问题就不可能出现。
          $out = Join-Path $env:RUNNER_TEMP "vdev-tools-win"
          $sr = 48000; $secs = 1; $n = $sr * $secs
          $pcm = New-Object byte[] ($n * 2)
          for ($i = 0; $i -lt $n; $i++) {
            $v = [int16](12000 * [Math]::Sin(2 * [Math]::PI * 220 * $i / $sr))
            $pcm[2 * $i] = [byte]($v -band 0xFF)
            $pcm[2 * $i + 1] = [byte](($v -shr 8) -band 0xFF)
          }
          $ms = New-Object System.IO.MemoryStream
          $bw = New-Object System.IO.BinaryWriter($ms)
          $bw.Write([char[]]"RIFF"); $bw.Write([int](36 + $pcm.Length)); $bw.Write([char[]]"WAVE")
          $bw.Write([char[]]"fmt "); $bw.Write([int]16); $bw.Write([int16]1); $bw.Write([int16]1)
          $bw.Write([int]$sr); $bw.Write([int]($sr * 2)); $bw.Write([int16]2); $bw.Write([int16]16)
          $bw.Write([char[]]"data"); $bw.Write([int]$pcm.Length); $bw.Write($pcm); $bw.Flush()
          [IO.File]::WriteAllBytes((Join-Path $out "probe.wav"), $ms.ToArray())
          $bw.Dispose(); $ms.Dispose()
          Push-Location $out
          try {
            .\vdev-mic-agent.exe run probe.wav --mix 1 --out out.wav --stats stats.json | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "mic-agent run 退出码 $LASTEXITCODE" }
          } finally { Pop-Location }
          $stats = Get-Content (Join-Path $out "stats.json") -Raw | ConvertFrom-Json
          if ($stats.run.frames -le 0) { throw "mic-agent 没处理任何帧（dll 没被加载？）" }
          Write-Host "mic-agent 处理 $($stats.run.frames) 帧，帧长 $($stats.run.frame_ms) ms（dll 从 exe 旁边自动加载）"
          Remove-Item (Join-Path $out "probe.wav"), (Join-Path $out "out.wav"), (Join-Path $out "stats.json")
      - name: 组装 zip
        id: pack
        shell: pwsh
        run: |
          # staging 目录已经在上面两步里放好 dll + mic-agent.exe（并冒烟过），这里只补其余工具
          $out = Join-Path $env:RUNNER_TEMP "vdev-tools-win"
          Copy-Item crates/vdev-camera-win/target/x86_64-pc-windows-msvc/release/vdev-camera-win.exe $out
          Copy-Item crates/vdev-app-win/target/x86_64-pc-windows-msvc/release/vdev-app-win.exe $out
          # 出包前的行为断言（不靠 grep）：许可证与降噪后端必须在 staging 里
          foreach ($f in @("vdev-mic-agent.exe", "librnnoise-0.dll", "librnnoise-LICENSE.txt", "THIRD_PARTY.md")) {
            if (-not (Test-Path (Join-Path $out $f))) { throw "出包前断言失败：$out 缺 $f" }
          }
          Get-ChildItem $out | Select-Object Name, Length | Format-Table | Out-Host
          $tag = if ("${{ github.event.inputs.tag }}") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          $zip = Join-Path $env:RUNNER_TEMP "vdev-tools-win-$tag.zip"
          Compress-Archive -Path (Join-Path $out "*") -DestinationPath $zip -Force
          Add-Content $env:GITHUB_OUTPUT "zip=$zip"
      - uses: actions/upload-artifact@v4
        with:
          name: vdev-tools-win
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error

  # ---------- macOS 用户态工具（免签名；HAL 插件只能 adhoc） ----------
  macos-tools:
    name: macOS 用户态工具
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: 构建 RNNoise（mic-agent 的降噪后端）
        run: |
          # 上游 tag v0.2 在 arm64 上编不过（vec_neon.h include 了不存在的 os_support.h），
          # 所以钉 master 的 commit；模型哈希由脚本自己校验
          brew list autoconf >/dev/null 2>&1 || brew install autoconf automake libtool
          bash scripts/release/build-rnnoise-macos.sh "$RUNNER_TEMP/librnnoise.dylib"
      - name: 组装 + 冒烟 + 打包
        run: |
          TAG="${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}"
          bash scripts/release/package-macos.sh "$TAG" "$RUNNER_TEMP/librnnoise.dylib" "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: vdev-macos
          path: ${{ runner.temp }}/dist/*.zip
          if-no-files-found: error

  # ---------- 发布 ----------
  publish:
    name: 发布 Release
    needs: [windows-drivers, windows-tools, macos-tools]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成 SHA256SUMS
        working-directory: dist
        run: |
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 写发版说明
        env:
          TAG: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
        run: |
          # quoted heredoc：内容原样保留（反引号/星号不会被 shell 解释），最后再用 sed 填 tag
          cat > NOTES.md <<'EOF'
          ## vdev Windows 驱动与工具（@TAG@）

          包内容：

          - `vdev-hid-win-*.zip` — VHF 虚拟键鼠驱动（sys + INF + CAT）+ CLI
          - `vdev-audio-win-*.zip` — PortCls/WaveRT 虚拟声卡驱动 + CLI（inject/capture）
          - `vdev-display-win-*.zip` — IddCx UMDF 虚拟显示器驱动 + CLI
          - `vdev-tools-win-*.zip` — 用户态工具（DirectShow 虚拟摄像头 CLI、宿主 GUI、**AI 虚拟麦克风
            `vdev-mic-agent.exe` 及其降噪后端 `librnnoise-0.dll`**）
          - `vdev-macos-*.zip` — macOS（**Apple Silicon / arm64**）命令行工具：**AI 虚拟麦克风 `vdev-mic-agent` + `librnnoise.dylib`**、
            CoreAudio HAL 虚拟声卡插件 `vdev-audio.driver`（含 `vdev-audio-ctl`）、宿主 CLI `vdev`
            （虚拟键鼠/虚拟屏/摄像头滤镜）。不含 `VDCamera.app`（需要 Apple 证书与 provisioning profile）。

          每个 Windows 包内若含 `vdev-test-signing.cer`，表示该包为**自签/测试签名**产物。
          macOS 包内另有 `SHA256SUMS.txt`（逐文件哈希，比 Release 附件里那份只哈希 zip 的更细）；
          各 zip 自身的 sha256 见 Release 附件 `SHA256SUMS.txt`。
          macOS 包内的 HAL 插件是 **adhoc 签名**（CI 没有 Developer ID）：macOS 26 的 coreaudiod 可能拒绝加载，
          请按包内 `README.md` 用你自己的证书重签后再安装。

          ## 降噪后端（RNNoise）版本与来源

          | 平台 | 来源 | 固定哈希 |
          |---|---|---|
          | macOS | xiph/rnnoise 源码构建，commit `70f1d256acd4b34a572f999a05c87bf00b67730d`（tag v0.2 在 arm64 编不过）；模型按 `model_version` 校验 | 模型 `0a8755f8e2d834eff6a54714ecc7d75f9932e845df35f8b59bc52a7cfe6e8b37` |
          | Windows | MSYS2 `mingw-w64-ucrt-x86_64-rnnoise-0.2-2-any.pkg.tar.zst`（上游 v0.2；只依赖 UCRT，无额外 DLL） | 包 `6892ed69c436e9d5f006df8b3fcf7efb2f57d556338db545eb8e2d6e55a820cf`，DLL `860d319b2e45e68c66b0d3eed680dd8c7a0887d4e1854c734202a20083ee56b7` |

          许可证：RNNoise 为 **BSD-3-Clause**，两个平台的包都随附原文
          （macOS `licenses/rnnoise-COPYING.txt` + `THIRD_PARTY.md`；Windows `librnnoise-LICENSE.txt` + `THIRD_PARTY.md`）。

          两平台版本不同源（macOS 跟的是已经跑过全部延迟/质量实测的那个 master commit，Windows 沿用 MSYS2 的 0.2），
          mic-agent 只用 `rnnoise_{get_frame_size,get_size,create,process_frame,destroy}` 这套稳定 C API，两侧都经过加载冒烟。

          安装（测试签名模式，管理员 PowerShell）：

          ```powershell
          certutil -addstore -f TrustedPublisher vdev-test-signing.cer
          certutil -addstore -f Root            vdev-test-signing.cer
          bcdedit /set testsigning on        # 需重启
          .\vdev-audio-win.exe install --inf-dir .
          .\vdev-audio-win.exe status
          .\vdev-audio-win.exe inject --tone 1000 --duration 4
          .\vdev-audio-win.exe capture --duration 6 --skip 4
          ```

          自签产物仅供开发/测试机使用；对外分发需微软认可的签名（attestation/WHQL）。
          下载校验：`sha256sum -c SHA256SUMS.txt`。
          EOF
          sed -i "s/@TAG@/${TAG}/" NOTES.md
          head -8 NOTES.md
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
          # workflow_dispatch 出的都算预发布；带 `-` 的 tag（v0.1.0-rc1 / v0.0.0-dev.1）也标预发布
          PRE: ${{ (github.event_name == 'workflow_dispatch' || contains(github.ref_name, '-')) && '--prerelease' || '' }}
        run: |
          # 本 job 没有 checkout（只下载 artifacts）→ gh 必须显式带 --repo，否则报
          # "failed to run git: fatal: not a git repository"。
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/SHA256SUMS.txt --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt --repo "$REPO" \
              --title "$TAG" --notes-file NOTES.md $PRE
          fi
